<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RO Map Atlas</title>
<style>
/* Layout: game field background, sticky xp-title toolbar, grid of xp-window map cards. */
:root {
  --ground-1: #7fb85a; --ground-2: #6aa548;
  --face: #ffffff; --face-2: #f4f6fb; --edge: #b4c0da; --border: #7d8fbc;
  --text: #1b1b1b; --dim: #5d6273;
  --title-1: #f7f9fe; --title-2: #dbe4f5; --title-3: #bccbe8; --title-text: #1d2d5a;
  --select: #4f72c4; --hit: #fff3c4;
  --share: #49b0e6; --mvp: #c4271b; --boss: #c26a00; --town: #2a8a2a; --dungeon: #6b3fa0; --field: #2f55c8;
  --ui: "PMingLiU", "新細明體", "Microsoft JhengHei", "PingFang TC", -apple-system, sans-serif;
  --num: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground-1: #24361c; --ground-2: #1c2b16;
  --face: #1e222b; --face-2: #252a35; --edge: #444d63; --border: #4a5570;
  --text: #dde2ec; --dim: #98a0b3;
  --title-1: #343c50; --title-2: #2b3244; --title-3: #232937; --title-text: #d6def2;
  --select: #6f8fe0; --hit: #4a4220;
  --share: #3d8fc0; --mvp: #ff6b5e; --boss: #f0a040; --town: #7fd27f; --dungeon: #b48ae8; --field: #8fa8ff;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --ground-1: #24361c; --ground-2: #1c2b16;
  --face: #1e222b; --face-2: #252a35; --edge: #444d63; --border: #4a5570;
  --text: #dde2ec; --dim: #98a0b3;
  --title-1: #343c50; --title-2: #2b3244; --title-3: #232937; --title-text: #d6def2;
  --select: #6f8fe0; --hit: #4a4220;
  --share: #3d8fc0; --mvp: #ff6b5e; --boss: #f0a040; --town: #7fd27f; --dungeon: #b48ae8; --field: #8fa8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: linear-gradient(180deg, var(--ground-1), var(--ground-2)) fixed; color: var(--text); font: 13px/1.45 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--title-2); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(180deg, var(--title-1), var(--title-2) 55%, var(--title-3)); color: var(--title-text); border-bottom: 1px solid var(--border); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1200px; margin: 0 auto; display: grid; gap: 8px; }
h1 { margin: 0; font-size: 17px; text-wrap: balance; }
.sub { font-size: 12px; opacity: .8; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
input[type=search] { flex: 1 1 240px; min-width: 0; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--face); color: var(--text); }
.chip { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; background: linear-gradient(180deg, var(--face), var(--face-2)); color: var(--title-text); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--select); color: #fff; border-color: var(--select); }
.chip:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; }
main { max-width: 1200px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.count { color: #fff; font-size: 12px; margin-bottom: 10px; text-shadow: 0 1px 2px #0006; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start; }
.map { background: var(--face); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: 2px 3px 10px #001e0040; min-width: 0; }
.head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 4px 8px; background: linear-gradient(180deg, var(--title-1), var(--title-2) 55%, var(--title-3)); color: var(--title-text); border-bottom: 1px solid var(--edge); }
.head b { font-size: 14px; }
.id { font: 11px var(--num); opacity: .7; }
.pill { font-size: 11px; font-weight: 700; }
.pill.town { color: var(--town); } .pill.field { color: var(--field); } .pill.dungeon { color: var(--dungeon); }
.body { padding: 6px 8px 8px; display: grid; gap: 6px; }
.meta { font-size: 11px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 12px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td { padding: 2px 4px; vertical-align: middle; }
td.lv, td.n, td.pct { font: 11px var(--num); text-align: right; white-space: nowrap; color: var(--dim); font-variant-numeric: tabular-nums; }
td.share { width: 30%; }
.meter { height: 6px; background: var(--face-2); border: 1px solid var(--edge); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--share); }
tr.hit td { background: var(--hit); }
.tag { font-size: 10px; font-weight: 700; margin-left: 4px; }
.tag.mvp { color: var(--mvp); } .tag.boss { color: var(--boss); }
.tag.aggr { color: var(--mvp); border: 1px solid currentColor; border-radius: 3px; padding: 0 2px; font-weight: 400; }
.sec { font-size: 11px; color: var(--dim); border-top: 1px solid var(--edge); padding-top: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.link { font: 11px var(--ui); padding: 1px 6px; border: 1px solid var(--edge); border-radius: 3px; background: var(--face-2); color: var(--text); cursor: pointer; }
.link:hover { border-color: var(--select); }
.cast { border: 1px solid var(--border); border-radius: 4px; background: var(--face); color: var(--text); padding: 6px 8px; display: grid; gap: 6px; }
.cast[hidden] { display: none; }
.cast-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.cast-list { display: flex; flex-wrap: wrap; gap: 4px 10px; max-height: 96px; overflow-y: auto; }
.cast-pick { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--edge); border-radius: 4px; background: var(--face-2); font-size: 12px; cursor: pointer; }
.cast-pick:has(input:checked) { border-color: var(--select); background: var(--select); color: #fff; }
.cast-pick input { margin: 0; accent-color: var(--select); }
.cast-pick small { opacity: .75; font: 10px var(--num); }
.actions { display: flex; flex-wrap: wrap; gap: 4px; }
.empty { color: #fff; text-shadow: 0 1px 2px #0006; }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div><h1>RO 放置仙境 · 地圖與怪物分布</h1><div class="sub"><span id="summary"></span> · Spawn share = that monster's count ÷ all regular spawns on the map.</div></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search a map or monster: 波利, prt_fild08, 時計塔…" autocomplete="off">
      <button class="chip" data-type="all" aria-pressed="true">All</button>
      <button class="chip" data-type="field" aria-pressed="false">Fields</button>
      <button class="chip" data-type="dungeon" aria-pressed="false">Dungeons</button>
      <button class="chip" data-type="town" aria-pressed="false">Towns</button>
      <button class="chip" id="mvp" aria-pressed="false">MVP / Boss only</button>
    </div>
    <div class="cast" id="cast" hidden>
      <div class="cast-head">
        <b>Move these characters</b>
        <span class="sub" id="cast-count"></span>
        <button class="chip" id="cast-all" type="button">Select all</button>
        <button class="chip" id="cast-none" type="button">Clear</button>
        <button class="chip" id="cast-refresh" type="button" title="Re-read the characters currently in play">Refresh</button>
      </div>
      <div class="cast-list" id="cast-list"></div>
    </div>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div class="count" id="move-status" role="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>

<script src="atlas-data.js"></script>
<script>
// [id, name, type, travelSec, connections, spawns[[name, lv, count, boss]], timed[[name, lv, count, respawnMin, varianceMin, boss]]]; boss 1 = boss, 2 = MVP
const byId = new Map(MAPS.map(m => [m[0], m]));
const TYPE = { town: "城鎮", field: "原野", dungeon: "地城" };
let type = "all", bossOnly = false;
let moving = false;
// Characters offered for selective moves; `chosen` holds profile numbers.
let characters = [];
const chosen = new Set();
const invoke = (command, args) => window.__TAURI__.core.invoke(command, args);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// Aggressive (主動) monsters by name+level, from the bundled game data; tags appear once it loads.
let AGGR = new Set();
window.fetch?.("game-data.json").then(r => r.json()).then(d => {
  AGGR = new Set(d.monsters.filter(m => m.behavior === "aggressive").map(m => `${m.name}|${m.lv}`));
  render();
}).catch(() => {});
const tag = b => b === 2 ? el("span", "tag mvp", "MVP") : b === 1 ? el("span", "tag boss", "BOSS") : null;

function updateChooseCount() {
  $("cast-count").textContent = characters.length ? `${chosen.size}/${characters.length} selected` : "";
}

function syncMoveButtons() {
  for (const b of document.querySelectorAll(".move-all")) b.disabled = moving || !window.__TAURI__;
  for (const b of document.querySelectorAll(".move-selected")) {
    b.disabled = moving || !window.__TAURI__ || !chosen.size;
    b.textContent = chosen.size ? `Move selected (${chosen.size})` : "Move selected";
  }
}

function renderCharacters() {
  $("cast").hidden = !characters.length;
  $("cast-list").replaceChildren(...characters.map(c => {
    const pick = el("label", "cast-pick");
    const box = el("input");
    box.type = "checkbox";
    box.checked = chosen.has(c.profile);
    box.addEventListener("change", () => {
      if (box.checked) chosen.add(c.profile); else chosen.delete(c.profile);
      updateChooseCount();
      syncMoveButtons();
    });
    const where = c.map ? ` · ${c.map}` : c.running === false ? " · stopped" : "";
    pick.append(box, el("span", null, c.name), el("small", null, where));
    pick.title = `Profile ${c.profile}${c.map ? ` · ${c.map}` : ""}`;
    return pick;
  }));
  updateChooseCount();
}

async function loadCharacters() {
  if (!window.__TAURI__?.core?.invoke) return;
  try {
    const list = await invoke("atlas_characters");
    characters = Array.isArray(list)
      ? list.filter(c => Number.isInteger(c?.profile) && typeof c.name === "string")
      : [];
  } catch {
    characters = [];
  }
  // Keep the user's picks, but drop characters that left play while the atlas was open.
  const valid = new Set(characters.map(c => c.profile));
  for (const profile of [...chosen]) if (!valid.has(profile)) chosen.delete(profile);
  renderCharacters();
  syncMoveButtons();
}

function card(m, q) {
  const [id, name, t, travel, conns, spawns, timed] = m;
  const box = el("article", "map");
  const head = el("div", "head");
  const left = el("div"); left.append(el("b", null, name), " ", el("span", "id", id));
  head.append(left, el("span", `pill ${t}`, TYPE[t] ?? t));
  const body = el("div", "body");
  const actions = el("div", "actions");
  const move = el("button", "chip move-all", "Move all");
  move.type = "button";
  move.disabled = moving || !window.__TAURI__;
  move.title = "Move all characters currently in play here. Cancels current fights; towns stop idling.";
  move.setAttribute("aria-label", `Move all characters to ${name}`);
  move.addEventListener("click", () => moveAll(id, name));
  const moveSome = el("button", "chip move-selected", "Move selected");
  moveSome.type = "button";
  moveSome.disabled = moving || !window.__TAURI__ || !chosen.size;
  moveSome.textContent = chosen.size ? `Move selected (${chosen.size})` : "Move selected";
  moveSome.title = "Move only the characters ticked above here. Cancels current fights; towns stop idling.";
  moveSome.setAttribute("aria-label", `Move selected characters to ${name}`);
  moveSome.addEventListener("click", () => moveSelected(id, name));
  actions.append(move, moveSome);
  body.append(actions);
  const lvs = [...spawns, ...timed].map(s => s[1]).filter(Boolean);
  const meta = el("div", "meta");
  if (lvs.length) meta.append(el("span", null, `Monster Lv ${Math.min(...lvs)}–${Math.max(...lvs)}`));
  const total = spawns.reduce((a, s) => a + s[2], 0);
  if (total) meta.append(el("span", null, `${total} regular spawns`));
  if (travel) meta.append(el("span", null, `${travel}s from town`));
  if (meta.childNodes.length) body.append(meta);
  const rows = (list, timedRows) => {
    const tb = el("table");
    for (const s of [...list].sort((a, b) => b[2] - a[2])) {
      const tr = el("tr");
      if (q && s[0].toLowerCase().includes(q)) tr.className = "hit";
      const nm = el("td"); nm.append(s[0]); const tg = tag(timedRows ? s[5] : s[3]); if (tg) nm.append(tg);
      if (AGGR.has(`${s[0]}|${s[1]}`)) { const a = el("span", "tag aggr", "主動"); a.title = "Aggressive: attacks on sight"; nm.append(a); }
      tr.append(nm, el("td", "lv", `Lv${s[1]}`), el("td", "n", `×${s[2]}`));
      if (timedRows) {
        tr.append(el("td", "pct", `${s[3]}±${s[4]} min`));
      } else {
        const pct = total ? (s[2] / total) * 100 : 0;
        const sh = el("td", "share"); const mt = el("div", "meter"); const fill = el("i"); fill.style.width = `${pct}%`; mt.append(fill); sh.append(mt);
        tr.append(sh, el("td", "pct", `${pct.toFixed(0)}%`));
      }
      tb.append(tr);
    }
    return tb;
  };
  if (spawns.length) body.append(rows(spawns, false));
  if (timed.length) { body.append(el("div", "sec", "Timed spawns (respawn)")); body.append(rows(timed, true)); }
  if (!spawns.length && !timed.length) body.append(el("div", "meta", "No monsters"));
  if (conns.length) {
    body.append(el("div", "sec", "Connects to"));
    const links = el("div", "links");
    for (const c of conns) {
      const b = el("button", "link", byId.get(c)?.[1] ?? c);
      b.type = "button"; b.title = c;
      b.addEventListener("click", () => { $("q").value = c; render(); window.scrollTo({ top: 0 }); });
      links.append(b);
    }
    body.append(links);
  }
  box.append(head, body);
  return box;
}

async function runMove(command, args, name, label) {
  if (moving) return;
  moving = true;
  syncMoveButtons();
  $("move-status").textContent = `Moving ${label} to ${name}…`;
  try {
    const results = await invoke(command, args);
    const failures = results.filter(r => r.error);
    $("move-status").textContent = `${results.length - failures.length}/${results.length} characters at ${name}.`
      + failures.map(r => ` ${r.name}: ${r.error}`).join("");
  } catch (e) {
    $("move-status").textContent = `Move failed: ${e.message || e}`;
  } finally {
    moving = false;
    syncMoveButtons();
  }
}

function moveAll(mapId, name) {
  return runMove("move_all", {mapId}, name, "all characters");
}

function moveSelected(mapId, name) {
  if (!chosen.size) {
    $("move-status").textContent = "Select at least one character first.";
    return;
  }
  const count = chosen.size;
  return runMove("move_selected", {mapId, profiles: [...chosen]}, name, `${count} character${count === 1 ? "" : "s"}`);
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  let list = MAPS.filter(m => type === "all" || m[2] === type);
  if (bossOnly) list = list.filter(m => m[6].some(s => s[5]) || m[5].some(s => s[3]));
  let note = "";
  if (q) {
    const exact = list.filter(m => m[0].toLowerCase() === q);
    const mapHit = m => m[0].toLowerCase().includes(q) || m[1].toLowerCase().includes(q);
    const monCount = m => [...m[5], ...m[6]].filter(s => s[0].toLowerCase().includes(q)).reduce((a, s) => a + s[2], 0);
    if (exact.length) list = exact;
    else {
      const maps = list.filter(mapHit);
      const mons = list.filter(m => !mapHit(m) && monCount(m) > 0).sort((a, b) => monCount(b) - monCount(a));
      list = [...maps, ...mons];
      if (mons.length) note = ` · monster matches sorted by how many spawn`;
    }
  }
  $("count").textContent = `${list.length} of ${MAPS.length} maps${note}`;
  $("grid").replaceChildren(...list.map(m => card(m, q)));
  if (!list.length) $("grid").append(el("p", "empty", "No map or monster matches. Try a shorter name."));
}

for (const b of document.querySelectorAll("[data-type]")) b.addEventListener("click", () => {
  type = b.dataset.type;
  document.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
$("mvp").addEventListener("click", e => { bossOnly = !bossOnly; e.currentTarget.setAttribute("aria-pressed", String(bossOnly)); render(); });
$("q").addEventListener("input", render);
$("cast-all").addEventListener("click", () => { for (const c of characters) chosen.add(c.profile); renderCharacters(); syncMoveButtons(); });
$("cast-none").addEventListener("click", () => { chosen.clear(); renderCharacters(); syncMoveButtons(); });
$("cast-refresh").addEventListener("click", loadCharacters);
// Offline copy bundled with the tray app; the tray opens it with a map preselected.
const mons = new Set(MAPS.flatMap(m => [...m[5], ...m[6]].map(s => s[0])));
const kinds = t => MAPS.filter(m => m[2] === t).length;
$("summary").textContent = `${MAPS.length} maps (${kinds("field")} fields, ${kinds("dungeon")} dungeons, ${kinds("town")} towns) · ${mons.size} monsters · offline data from ${MAPS_UPDATED}`;
window.atlasSearch = q => { $("q").value = q ?? ""; render(); window.scrollTo({ top: 0 }); };
// Re-read the in-play list when the atlas regains focus, so characters opened or
// closed in the tray show up without reloading the page.
window.atlasRefresh = loadCharacters;
window.addEventListener?.("focus", loadCharacters);
$("q").value = window.ATLAS_Q ?? "";
render();
renderCharacters();
syncMoveButtons();
loadCharacters();
</script>
</body>
</html>
