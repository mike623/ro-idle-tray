<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>RO 戰鬥畫面</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  /* OFL pixel font; twRO itself used Windows' bitmap 細明體 at 12px, listed first for Windows. */
  @font-face { font-family:'Fusion Pixel 12px'; src:url(fonts/fusion-pixel-12px-proportional-zh_tw.otf.woff2) format('woff2'); }
  .stage { position:relative; width:100%; height:100%; overflow:hidden; background:#151a12; }
  /* Like the client: windows stay 1:1 pinned to the screen edges, a smaller screen sees less world. */
  .world { position:absolute; width:980px; height:640px;   /* keep the fight (~520,380) in view */
    left:clamp(calc(100% - 980px), calc(50% - 520px), 0px); top:clamp(calc(100% - 640px), calc(50% - 380px), 0px); }
  canvas { position:absolute; inset:0; pointer-events:none; }
  #ground { z-index:0; filter:brightness(.9); } #under { z-index:1; } #fx { z-index:1600; }
  .sprite { position:absolute; transform:translate(-50%,-100%); transition:opacity .5s; cursor:pointer; }
  /* RO client bar: green HP (red under 25%) over blue SP, 1px dark frame */
  .bar { position:absolute; width:60px; transform:translateX(-50%); background:#10203a; border:1px solid #0b1020; z-index:1400; pointer-events:none; display:flex; flex-direction:column; gap:1px; }
  .bar i { display:block; height:3px; background:#18e830; }
  .bar i.low { background:#e82020; } .bar i.sp { background:#2060e8; }
  .cast { position:absolute; width:46px; height:5px; transform:translateX(-50%); background:#000c; border:1px solid #d9d2c2; z-index:1500; pointer-events:none; }
  .cast i { display:block; height:100%; background:linear-gradient(#9cff7a,#34b52c); }
  .drop { position:absolute; width:22px; height:22px; transform:translate(-50%,-50%); filter:drop-shadow(0 2px 2px #000); z-index:1300; pointer-events:none; }
  .ro, .banner { font:12px/1.2 "MingLiU", "PMingLiU", Gulim, "Fusion Pixel 12px", sans-serif; -webkit-font-smoothing:none; }
  .banner { position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:2100; font-weight:bold; color:#ffff63;
    text-shadow:-1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000; white-space:nowrap; }
  /* RO client windows: textures come from the basic_interface set (see UI in battle.js). */
  .ro { position:absolute; z-index:2200; color:#000; user-select:none; }
  .ro .tb { height:17px; display:flex; align-items:center; padding:0 6px 0 8px; position:relative; }
  .ro .tb::before, .ro .tb::after { content:""; position:absolute; top:0; width:12px; height:17px; }
  .ro .tb::before { left:0; } .ro .tb::after { right:0; }
  .ro .tb b { position:relative; z-index:1; font-weight:normal; flex:1; }
  .ro .tb .sys { position:relative; z-index:1; display:flex; gap:2px; } .ro .tb .sys i { width:11px; height:11px; display:block; }
  .ro .body { background:#fff; border:1px solid #8c9ab8; border-top:0; }
  .gze { width:85px; height:9px; position:absolute; }
  .gze i { display:block; height:8px; }
  #basic { left:8px; top:8px; width:280px; height:120px; }
  #basic .t { position:absolute; white-space:nowrap; } #basic .num { text-align:right; width:85px; }
  #basic .tb { position:absolute; inset:0 0 auto 0; } #basic .tb::before, #basic .tb::after { display:none; }
  .mbtn { height:20px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center; min-width:30px; cursor:pointer; position:relative; }
  .mbtn::before, .mbtn::after { content:""; position:absolute; top:0; width:7px; height:20px; } .mbtn::before { left:-7px; } .mbtn::after { right:-7px; }
  .mbtn.on { color:#1c4bc4; font-weight:bold; }
  #ctl { position:absolute; left:209px; top:22px; display:flex; flex-direction:column; gap:3px; align-items:center; }
  #short { left:8px; top:130px; width:280px; height:29px; }
  #short img { position:absolute; top:3px; width:24px; height:24px; } #short img.hot { outline:2px solid #ffd800; outline-offset:-1px; }
  #party { right:8px; top:8px; width:190px; }
  #party .row { height:20px; display:flex; align-items:center; gap:4px; padding:0 5px; cursor:pointer; }
  #party .row.sel { background:#dce4f7; } #party .row span { flex:1; overflow:hidden; white-space:nowrap; }
  #party .row .gze { position:static; width:60px; }
  #party .foot { padding:4px 0 5px; display:flex; justify-content:center; } #party .foot small { padding:0 6px 4px; display:block; color:#556; }
  #chat { left:8px; bottom:8px; width:min(600px, calc(100% - 16px)); }
  #log { height:104px; padding:4px 6px; background:rgba(0,0,0,.45); display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden;
    color:#fff; text-shadow:1px 1px 0 #000; line-height:16px; }
  #log .sys { color:#ffff63; } #log .pt { color:#c6ff9c; }
  #input { width:600px; max-width:100%; height:24px; position:relative; overflow:hidden; }
  #time { position:absolute; left:6px; top:5px; width:86px; text-align:center; cursor:pointer; }
  #time.live { color:#d0201a; font-weight:bold; }
  #seek { position:absolute; left:112px; top:4px; width:calc(100% - 130px); height:16px; margin:0; accent-color:#5b7fd6; }
  #empty { position:absolute; inset:0; display:grid; place-items:center; z-index:2150; color:#fff; text-shadow:1px 1px 0 #000; pointer-events:none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="world" id="world"><canvas id="ground" width="980" height="640"></canvas><canvas id="under" width="980" height="640"></canvas><canvas id="fx" width="980" height="640"></canvas>
    <div class="banner ro" id="banner"></div></div>
  <div class="ro" id="empty"></div>
  <div class="ro" id="basic"><div class="tb"><b id="pName"></b></div>
    <div class="t" style="left:8px;top:24px" id="pCls"></div><div class="t" style="left:8px;top:40px" id="pLv"></div>
    <div class="t" style="left:86px;top:21px">HP</div><div class="gze" style="left:110px;top:21px"><i id="pHp"></i></div><div class="t num" style="left:110px;top:32px" id="pHpT"></div>
    <div class="t" style="left:86px;top:42px">SP</div><div class="gze" style="left:110px;top:42px"><i id="pSp"></i></div><div class="t num" style="left:110px;top:53px" id="pSpT"></div>
    <div class="t" style="left:14px;top:77px;width:180px;overflow:hidden" id="pBuff"></div>
    <div class="t" style="left:8px;top:103px;width:190px;overflow:hidden" id="mapName"></div>
    <div id="ctl"><span class="mbtn" id="play">❚❚</span><span class="mbtn on" data-speed="1">1x</span><span class="mbtn" data-speed="2">2x</span><span class="mbtn" data-speed="4">4x</span></div>
  </div>
  <div class="ro" id="short"></div>
  <div class="ro" id="party"><div class="tb"><b>隊伍</b><span class="sys"><i id="sysMini"></i><i id="sysClose"></i></span></div>
    <div class="body"><div id="roster"></div><div class="foot"><span class="mbtn" id="dl">下載離線素材</span></div><small id="dlNote"></small></div></div>
  <div class="ro" id="chat"><div id="log"></div><div id="input"><span id="time" title="回到即時"></span><input type="range" id="seek" min="0" step="10"></div></div>
</div>
<script src="battle.js"></script>
</body>
</html>
