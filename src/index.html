<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RO Idle Tray</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="bubble.js" data-embed></script>
    <script type="module" src="main.js" defer></script>
    <script type="module" src="chat.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <header class="top" data-tauri-drag-region>
        <div class="top-text" data-tauri-drag-region>
          <div class="title" data-tauri-drag-region>RO 放置仙境 <span class="ver" id="version"></span> <span class="pill" id="overall" hidden></span></div>
          <div class="dim small" id="summary" data-tauri-drag-region>Loading…</div>
        </div>
        <div class="top-side">
          <button type="button" class="icon-btn" id="update" hidden></button>
          <button type="button" class="icon-btn pin" id="pin" title="Pin: float above other windows and Spaces" aria-label="Keep panel on top" aria-pressed="false">📌</button>
          <button type="button" class="icon-btn gear" id="ai-open" title="AI provider settings" aria-label="AI provider settings" aria-expanded="false">⚙</button>
          <button type="button" class="icon-btn panel-hide" id="panel-hide" title="Hide panel (reopen from the menu bar)" aria-label="Hide panel">✕</button>
        </div>
      </header>
      <div class="tiles" id="tiles" role="group" aria-label="依狀態篩選">
        <button type="button" class="tile attn" data-filter="attention" aria-pressed="false"><b></b><span>需要注意</span></button>
        <button type="button" class="tile idle-t" data-filter="idle" aria-pressed="false"><b></b><span>掛機中</span></button>
        <button type="button" class="tile off-t" data-filter="offline" aria-pressed="false"><b></b><span>離線</span></button>
      </div>
      <section class="ai" id="ai" hidden aria-label="AI provider settings">
        <div class="ai-card">
          <div class="ai-head">
            <div>
              <div class="ai-title">AI provider</div>
              <div class="ai-desc">Anthropic Messages API, e.g. your local CLIProxyAPI.</div>
            </div>
            <button type="button" class="ai-x" id="ai-close" aria-label="Close settings">×</button>
          </div>
          <label class="ai-field"><span>Base URL</span>
            <input id="ai-url" type="url" placeholder="http://127.0.0.1:8317" spellcheck="false" autocomplete="off" />
          </label>
          <label class="ai-field"><span>API key <em class="ai-badge" id="ai-keystate" hidden>Encrypted locally</em></span>
            <input id="ai-key" type="password" placeholder="Paste key" spellcheck="false" autocomplete="off" />
          </label>
          <label class="ai-field"><span>Web search key <em class="ai-badge" id="ai-tavily-state" hidden>Encrypted locally</em></span>
            <input id="ai-tavily-key" type="password" placeholder="tvly-… (optional)" spellcheck="false" autocomplete="off" aria-describedby="ai-tavily-hint" />
            <small class="ai-hint" id="ai-tavily-hint">Optional. A Tavily key lets the tray's chat search the web through Tavily's MCP server (never the in-game chats).</small>
          </label>
          <div class="ai-field">
            <span><label id="ai-model-label">Model</label>
              <button type="button" class="ai-refresh" id="ai-model-refresh" title="Reload model list" aria-label="Reload model list">↻</button>
            </span>
            <input type="hidden" id="ai-model" />
            <div class="ai-combo" id="ai-model-combo">
              <button type="button" class="ai-combo-trigger" id="ai-model-trigger"
                      aria-haspopup="listbox" aria-expanded="false" aria-controls="ai-model-list"
                      aria-labelledby="ai-model-label" aria-describedby="ai-model-hint">
                <span class="ai-combo-value placeholder" id="ai-model-value">Select a model…</span>
                <svg class="ai-combo-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="ai-combo-pop" id="ai-model-pop" hidden>
                <div class="ai-combo-search">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
                  <input id="ai-model-search" type="text" placeholder="Search models…" autocomplete="off"
                         spellcheck="false" role="combobox" aria-expanded="true" aria-autocomplete="list"
                         aria-controls="ai-model-list" aria-label="Search models" />
                </div>
                <ul class="ai-combo-list" id="ai-model-list" role="listbox" aria-labelledby="ai-model-label"></ul>
                <div class="ai-combo-empty" id="ai-model-empty" hidden>No model found.</div>
              </div>
            </div>
            <small class="ai-hint" id="ai-model-hint" role="status" aria-live="polite"></small>
          </div>
          <label class="ai-field"><span>Request format</span>
            <select id="ai-format" aria-describedby="ai-format-hint">
              <option value="auto">Auto (Anthropic for claude-*, else OpenAI)</option>
              <option value="anthropic">Anthropic Messages (/v1/messages)</option>
              <option value="openai">OpenAI chat completions (/v1/chat/completions)</option>
            </select>
            <small class="ai-hint" id="ai-format-hint">How chat talks to CLIProxyAPI. Change it if a model answers with a format error.</small>
          </label>
          <div class="ai-actions">
            <button type="button" class="ai-btn primary" id="ai-save">Save</button>
            <button type="button" class="ai-btn outline" id="ai-test">Test connection</button>
          </div>
          <div class="ai-result" id="ai-result" role="status" hidden></div>
        </div>
      </section>
      <div class="stage">
      <div class="list" id="list"></div>
      <!-- The one assistant (bubble.js); "@角色" scopes a question to that character. -->
      <section id="assistant" class="assistant" hidden aria-label="助理"></section>
      </div>
      <footer class="foot">
        <button type="button" class="btn" id="recall" title="Send every character back to its save point (回儲存點). Stops idling.">Recall</button>
        <button type="button" class="btn" id="refresh" title="Boot every offline character one by one to load its latest data; each goes offline again a minute later">Refresh</button>
        <button type="button" class="btn" id="idle-all" title="Start idling every stopped character; when all are idling, stop all">Idle All</button>
        <button type="button" class="btn" id="items" title="Edit every character's 道具設定 in one table, then apply to all">Items</button>
        <button type="button" class="btn" id="maps" title="Offline map and monster atlas">Maps</button>
        <!-- Less-used actions fold into one menu that opens upward. -->
        <details class="more" id="more">
          <summary class="btn">More ▾</summary>
          <div class="menu" role="menu">
            <button type="button" id="guide" role="menuitem" title="Player strategy guide: class builds, skill simulator, gear keep/sell (ned-lin-9527.github.io)">Guide</button>
            <button type="button" id="classes" role="menuitem" title="Class progression chart: Novice to 4th class">Classes</button>
            <button type="button" id="exports" role="menuitem" title="Open ~/Downloads/RO Idle Tray">Exports</button>
            <button type="button" id="add" role="menuitem" title="Add another isolated account profile">Add Profile</button>
            <hr>
            <button type="button" id="login" role="menuitemcheckbox" aria-pressed="false" title="Launch RO Idle Tray when you log in">Start at Login <span class="switch" aria-hidden="true"><span></span></span></button>
            <button type="button" id="quit" role="menuitem" title="Quit RO Idle Tray">Quit</button>
          </div>
        </details>
        <button type="button" id="assistant-fab" class="fab" aria-expanded="false" aria-controls="assistant">✦ 助理</button>
      </footer>
    </main>
    <!-- Row detail popups render here, outside the faded and clipped list rows. -->
    <div id="popover"></div>

    <!-- One compact row per signed-in profile; .detail expands inline. -->
    <template id="card">
      <section class="account prow">
        <div class="sum">
          <button type="button" class="dot"></button>
          <div class="l1">
            <span class="name"></span><button type="button" class="nick" title="Nickname for your own reference (only in this app)"></button><span class="cls"></span><span class="why" hidden></span>
            <button type="button" class="lvl" aria-expanded="false"><span class="dim">Lv</span> <b class="base"></b><span class="dim">/</span><b class="job"></b> <span class="chev" aria-hidden="true">▾</span></button>
          </div>
          <div class="l2">
            <span class="minibars" aria-hidden="true">
              <span class="bar"><i class="hp-bar"></i></span>
              <span class="bar"><i class="sp-bar"></i></span>
              <span class="bar"><i class="base-bar"></i></span>
            </span>
            <button type="button" class="map-link" title="Show spawns in the map atlas"><span class="map"></span></button>
            <span class="flags"></span>
            <span class="ago"></span>
          </div>
          <button type="button" class="ask" title="問這隻角色的助理">✦</button>
          <button type="button" class="go" title="Open game window" aria-label="Open game window">↗</button>
          <button type="button" class="idle"></button>
          <span class="offt"></span>
        </div>
        <div class="detail" hidden>
          <div class="dgrid">
            <span class="lbl">Base</span><div class="bar"><i class="base-bar"></i></div><span class="num base-pct"></span>
            <span class="lbl">Job</span><div class="bar"><i class="job-bar"></i></div><span class="num job-pct"></span>
            <span class="lbl hp-label">HP</span><div class="bar"><i class="hp-bar"></i></div><span class="num hp"></span>
            <span class="lbl sp-label">SP</span><div class="bar"><i class="sp-bar"></i></div><span class="num sp"></span>
          </div>
          <div class="kv">
            <div class="between"><span class="weight"></span><span class="zeny"></span></div>
            <div class="points" hidden></div>
            <div class="between"><span class="dim">地圖</span><button type="button" class="map-link" title="Show spawns in the map atlas"><b class="map"></b></button></div>
            <div class="between"><span class="dim">行動</span><span class="action"></span></div>
            <div class="between"><span class="dim">目標</span><span class="target"></span></div>
            <div class="bar target-track" hidden><i class="target-bar"></i></div>
            <div class="between"><span class="dim">職業方向</span><select class="goal" title="Final job this character is heading for — the assistant plans skills and stats toward it"></select></div>
          </div>
          <div class="between">
            <span class="status"><i></i><span class="ago"></span></span>
            <span class="row">
              <span class="dim tiny-txt acct"></span>
              <button type="button" class="link remove">Remove</button>
              <button type="button" class="btn sm open">Open</button>
            </span>
          </div>
        </div>
      </section>
    </template>

    <!-- Profile parked on the character-select screen. -->
    <template id="roster">
      <section class="account prow roster">
        <div class="rhead">
          <span class="dot sel" aria-hidden="true"></span>
          <span class="name">選擇角色</span>
          <span class="dim tiny-txt count"></span>
          <span class="grow"></span>
          <span class="dim tiny-txt acct"></span>
          <button type="button" class="link remove">Remove</button>
          <button type="button" class="btn sm open">Open</button>
        </div>
        <ul class="chars"></ul>
      </section>
    </template>

    <!-- Profile that has never signed in. -->
    <template id="empty">
      <section class="account prow empty">
        <div class="rhead">
          <span class="dot off" aria-hidden="true"></span>
          <span class="name dim">Not signed in</span>
          <span class="dim tiny-txt hint" title="Sign in with Google once. The session is kept for this profile.">Sign in once</span>
          <span class="grow"></span>
          <span class="dim tiny-txt acct"></span>
          <button type="button" class="link remove">Remove</button>
          <button type="button" class="btn sm accent open">Open</button>
        </div>
      </section>
    </template>
  </body>
</html>
