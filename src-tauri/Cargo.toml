[package]
name = "ro-idle-tray"
version = "0.2.6"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ro_idle_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Agent loop for the assistant (owner decision: rig-core). Pinned: rig's API moves between minors.
rig-core = { version = "=0.46.0", default-features = false }
rig-agent = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", features = ["rustls"] }
# Already in the tree (reqwest/hyper/rig): stream handling, safe file names, chat lock + timeouts.
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Already in the tree via the updater; used for the AI connection test.
# https base URLs rely on the TLS backend the updater enables (rustls).
reqwest = { version = "0.13", default-features = false }
# Tavily's hosted MCP server, bridged into rig tools. `reqwest` here turns on
# rustls for the shared reqwest, which HTTPS to mcp.tavily.com needs.
rmcp = { version = "3.8", default-features = false, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
# Local encrypted key files (secret.rs): AES-256-GCM, key derived from this machine's id.
aes-gcm = "0.10"
machine-uid = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
mac-notification-sys = "0.6"
